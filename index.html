<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rahat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(160deg, #FFFFFF 0%, #F0FDFB 35%, #CCFBF1 70%, #99F6E4 100%);
      color: #1A1A1A;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
    }
    .orb-1 { width: 300px; height: 300px; background: #5EEAD4; top: -80px; right: -60px; }
    .orb-2 { width: 250px; height: 250px; background: #99F6E4; bottom: -60px; left: -40px; animation-delay: -4s; }
    .orb-3 { width: 180px; height: 180px; background: #2DD4BF; top: 50%; left: 60%; opacity: 0.15; animation-delay: -2s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }

    .card {
      max-width: 480px;
      position: relative;
      z-index: 1;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar-ring {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #14B8A6, #0D9488, #0F766E);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
      opacity: 0;
      position: relative;
    }
    .avatar-ring::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5EEAD4, #14B8A6, #0F766E);
      z-index: -1;
      animation: spin 6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .avatar-letter {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #FFFFFF;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 10px;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      opacity: 0;
    }

    .role {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #0D9488;
      margin-bottom: 20px;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
      opacity: 0;
    }

    .motto {
      font-size: 1.1rem;
      color: #374151;
      font-weight: 500;
      line-height: 1.6;
      margin-bottom: 12px;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
      opacity: 0;
    }
    .motto span { color: #0F766E; font-style: italic; }

    .divider {
      width: 48px;
      height: 3px;
      background: linear-gradient(90deg, #14B8A6, #5EEAD4);
      border-radius: 4px;
      margin: 24px auto;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
      opacity: 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #0F766E;
      background: rgba(204, 251, 241, 0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(20, 184, 166, 0.2);
      padding: 6px 16px;
      border-radius: 100px;
      margin-bottom: 32px;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.55s forwards;
      opacity: 0;
    }
    .pulse { width: 7px; height: 7px; border-radius: 50%; background: #14B8A6; position: relative; animation: ping 2s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.4; } 100% { transform: scale(2.5); opacity: 0; } }

    .links {
      display: flex;
      justify-content: center;
      gap: 12px;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
      opacity: 0;
    }
    .link-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #0F766E;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(20, 184, 166, 0.15);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .link-btn:hover {
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(20, 184, 166, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(13, 148, 136, 0.12);
    }
    .link-btn svg { width: 16px; height: 16px; }

    @media (max-width: 480px) {
      h1 { font-size: 2rem; }
      .links { flex-direction: column; align-items: center; }
      .link-btn { width: 200px; justify-content: center; }
      .orb { display: none; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="card">
    <div class="avatar-ring">
      <span class="avatar-letter">R</span>
    </div>
    <h1>Rahat</h1>
    <div class="role">Founder · Tool Builder · AI Researcher</div>
    <p class="motto"><span>"if it's online, it's my playground."</span></p>
    <div class="divider"></div>
    <div class="status">
      <span class="pulse"></span>
      Building GrokHunt
    </div>
    <div class="links">
      <a href="https://x.com/rahats_x" target="_blank" class="link-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L5.83 4.085H4.126z"/></svg>X
      </a>
      <a href="https://github.com/helorahat" target="_blank" class="link-btn">

      </a>
      <a href="mailto:hello.rahat.me@gmail.com" class="link-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>Email
      </a>
    </div>
  </div>
</body>
</html>
